name = "nas-ingest"
main = "src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 阶段 1：先跑通单设备。配置一个源即可。
# 若设置了 METRICS_URL，仅采集该源；未设置时从 KV device:list 读取多源（阶段3准备）
[vars]
METRICS_URL = "https://wkyapi.111312.xyz/metrics"

# 每 60 秒触发一次采样
[triggers]
crons = ["* * * * *"]

# D1：历史采样
[[d1_databases]]
binding = "DB"
database_name = "nas-history"
database_id = "1f47dbb7-388e-4544-ad01-84e62a904dfe"

# KV：实时快照 + 设备注册表
[[kv_namespaces]]
binding = "KV"
id = "902cef368819436a96c20163cb9eacd6"