name = "nas-ingest"
main = "src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 多源自动接入（阶段三）：
# - 每轮采样会把 KV device:list 里登记的所有 metrics 源全部抓取（设置弹窗添加的链接自动进来）。
# - vars.METRICS_URL 仅作"默认/保底源"：为空时自动注册为第一个长驻源；也可留空，完全由前端添加驱动多源。
[vars]
METRICS_URL = "https://wkyapi.111312.xyz/metrics"

# 每 5 分钟触发一次采样（降低免费额度消耗，趋势图精度足够）
[triggers]
crons = ["*/5 * * * *"]

# D1：历史采样
[[d1_databases]]
binding = "DB"
database_name = "nas-history"
database_id = "1f47dbb7-388e-4544-ad01-84e62a904dfe"

# KV：实时快照 + 设备注册表
[[kv_namespaces]]
binding = "KV"
id = "902cef368819436a96c20163cb9eacd6"